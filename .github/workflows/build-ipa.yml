name: Build unsigned IPA

# Put this file at .github/workflows/build-ipa.yml in YOUR fork of
# iDared32bit-emu/iDared32bit (default branch: idared32bit), then run it from
# the Actions tab (Run workflow). The IPA is unsigned: sign it by sideloading
# with SideStore / AltStore, which re-sign it with your own Apple ID.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      # CMake 4.x refuses projects declaring cmake_minimum_required < 3.5
      # (sdl2-sys's bundled SDL does). This tells CMake to accept them.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # If dynarmic-core.patch is in the repo root (uploaded through the GitHub
      # web UI) and the Dynarmic submodule isn't there yet, apply the patch and
      # add the submodule here on the runner. Nothing to do locally.
      - name: Apply Dynarmic core patch (only if present and not yet applied)
        run: |
          if [ -f dynarmic-core.patch ] && [ ! -d vendor/dynarmic/src ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git apply --index dynarmic-core.patch
            git submodule add -b ios-hyperhle-experiment \
              https://github.com/johnny901901901/dynarmic.git vendor/dynarmic
            git -C vendor/dynarmic checkout f488f760c69c42a97331961e8e6c359b46ccc9e9
            git submodule update --init --recursive vendor/dynarmic
            git rm -q -f dynarmic-core.patch
            git add vendor/dynarmic .gitmodules
            git commit -q -m "Replace the ARM interpreter with the dynarmic JIT core (from Applesauce)"
            echo "APPLIED_PATCH=1" >> "$GITHUB_ENV"
          else
            echo "Patch not needed (missing, or already applied)."
          fi

      # Optional second patch (JIT check + "Enable JIT" alert in the picker).
      # Upload jit-check.patch to the repo root of the branch you run on.
      - name: Apply JIT check patch (only if present)
        run: |
          if [ -f jit-check.patch ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git apply --index jit-check.patch
            git rm -q -f jit-check.patch
            git commit -q -m "Add JIT check and Enable JIT alert to the app picker"
            echo "APPLIED_PATCH=1" >> "$GITHUB_ENV"
          else
            echo "No jit-check.patch, skipping."
          fi

      # dynarmic (the CPU core) needs the Boost headers; build.rs picks up
      # vendor/boost if it exists.
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: vendor/boost
          key: boost_1_81_0_headers

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: |
          curl -L -o boost.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor
          tar xzf boost.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Select newest stable Xcode 26 (needed for the iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26.*.app | grep -vi -e beta -e candidate | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS 26"

      - name: Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project iphone/iDared32bit.xcodeproj \
            -scheme "iDared 32bit" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Show errors (only on failure)
        if: failure()
        run: |
          echo "=== error lines ==="
          grep -n -E "error:|error\[|fatal error|BUILD FAILED|failed with exit code" xcodebuild.log | head -60
          echo "=== last 60 lines ==="
          tail -n 60 xcodebuild.log

      - name: Upload full build log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry iDared32bit.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iDared32bit-ipa
          path: iDared32bit.ipa

      # After a successful build with the patch applied, save the result as a
      # branch so later runs (and your edits) start from it.
      - name: Push result to branch dynarmic-core
        if: env.APPLIED_PATCH == '1'
        continue-on-error: true
        run: git push --force origin HEAD:refs/heads/dynarmic-core
